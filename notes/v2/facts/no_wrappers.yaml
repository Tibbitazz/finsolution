# Provisional registry records — Norway, non-pension account wrappers.
# Contract: research/S3_REGISTRY_ARCHITECTURE.md §1. Physical format provisional (S6b/S8).
# Pension wrappers (IPS, EPK, others) are excluded (ADR-0020) and must not be added.
file_defaults:
  version: 1
  domain: wrapper
  scope: {jurisdiction: NO, taxpayer: individual}
  legal_status: effective
  verification_status: verified
  verification_level: V-full
  verified_on: 2026-10-01
  recorded_at: 2026-10-01
  effective_to: null
  reverify_by: 2027-10-01
  supersedes: null
  superseded_by: null
  conflicts_with: null
  source:
    citation: "Skatteetaten, Share savings account (ASK)"
    url: https://www.skatteetaten.no/en/person/taxes/get-the-taxes-right/shares-and-securities/about-shares-and-securities/share-savings-account-ask/
    retrieved_on: 2026-10-01
    authority_type: tax_authority
  provenance: "S3 research, Claude-assisted, owner review at G3"

records:
  - fact_id: no.wrapper.ask.eligible_holdings
    scope: {jurisdiction: NO, account_type: ASK}
    attribute: eligible_instrument_types
    value:
      permitted:
        - {instrument_type: listed_share, condition: "issuer domiciled in EEA"}
        - {instrument_type: securities_fund_unit, condition: "fund domiciled in EEA; share component > 80% at start of income year"}
        - {instrument_type: cash, condition: "no interest accrues"}
      prohibited: [money_market_fund, bond, non_eea_share, derivative]
    unit: null
    basis: null
    period: income_year
    effective_from: null
    claim: "ASK may hold EEA-listed shares and EEA equity funds (>80% shares); no money-market funds; cash earns no interest."
    notes: "'prohibited' lists types not in the permitted set; derivative/bond listed by exclusion (interpretation of the permitted-only rule)."

  - fact_id: no.wrapper.ask.dividend_timing
    scope: {jurisdiction: NO, account_type: ASK}
    attribute: dividend_taxation_timing
    value: on_withdrawal_in_excess_of_cost_basis
    unit: null
    basis: null
    period: null
    effective_from: 2019-01-01
    claim: "Dividends inside ASK are not taxed on payout; taxed only when withdrawals exceed the input value."
    notes: "effective_from from secondary summary of Skatteetaten (dividends deferred from 2019); V-full for the current rule only."

  - fact_id: no.wrapper.ask.withdrawal_rule
    scope: {jurisdiction: NO, account_type: ASK}
    attribute: withdrawal_taxation
    value: {tax_free_up_to: input_value, excess_taxed_as: share_income_after_shielding}
    unit: null
    basis: null
    period: income_year
    effective_from: null
    claim: "Withdrawals up to input value are tax-free; excess taxed as share income after shielding."

  - fact_id: no.wrapper.ask.losses
    scope: {jurisdiction: NO, account_type: ASK}
    attribute: loss_deductibility
    value: only_on_account_closure
    unit: null
    basis: null
    period: null
    effective_from: null
    claim: "Losses are deductible only when the account is closed."

  - fact_id: no.wrapper.ask.foreign_withholding
    scope: {jurisdiction: NO, account_type: ASK}
    attribute: treatment_of_foreign_withholding
    value: treated_as_withdrawal_reducing_input_value
    unit: null
    basis: null
    period: null
    effective_from: null
    claim: "Foreign tax actually withheld is considered taken out of the ASK, reducing the input value."

  - fact_id: no.wrapper.ask.foreign_tax_credit
    scope: {jurisdiction: NO, account_type: ASK}
    attribute: credit_for_foreign_withholding_inside_ask
    value: null
    unit: null
    basis: null
    period: null
    verification_status: unavailable
    verification_level: null
    effective_from: null
    reverify_by: 2027-01-31
    claim: "Not stated on the Skatteetaten ASK page; unresolved (U4)."
    notes: "Must resolve to unknown, never to 'no credit' or 'full credit' (FX3-18)."

  - fact_id: no.wrapper.ask.accounts_and_transfers
    scope: {jurisdiction: NO, account_type: ASK}
    attribute: account_count_and_transfers
    value:
      max_accounts: unlimited
      ask_to_ask_transfer: tax_neutral
      transfer_in_from_ordinary_account: taxable_realisation_fifo
    unit: null
    basis: null
    period: null
    effective_from: null
    claim: "Any number of ASKs; ASK-to-ASK transfers tax-neutral; moving holdings in from an ordinary account is a taxable realisation (FIFO)."

  - fact_id: no.wrapper.ordinary_account
    scope: {jurisdiction: NO, account_type: ordinary_taxable}
    attribute: taxation_model
    value: realisation_based_dividends_taxed_on_receipt
    unit: null
    basis: null
    period: income_year
    effective_from: null
    source:
      citation: "Skatteetaten, Shares and securities (tax rules pages)"
      url: https://www.skatteetaten.no/en/person/taxes/get-the-taxes-right/shares-and-securities/
      retrieved_on: 2026-10-01
      authority_type: tax_authority
    claim: "Gains taxed on realisation; dividends taxed in the year received (share income above shielding)."
    verification_level: V-abs
