  - fact_id: no.wrapper.ask.foreign_currency
    scope: {jurisdiction: NO, account_type: ASK}
    attribute: foreign_currency_inside_ask
    value: {may_buy_currency_with_account_funds: false, may_receive_currency: [deposit, sale_proceeds], fx_gain_loss_exempt_under_ask: false, fx_realisation_events: [conversion_to_nok, withdrawal, use_to_buy_securities]}
    unit: null
    basis: null
    period: income_year
    effective_from: null
    source:
      citation: "Skatte-ABC 2025/2026, A-10 Aksjesparekonto, A-10-5.2"
      url: https://www.skatteetaten.no/rettskilder/type/handboker/skatte-abc/gjeldende/a-10-aksjesparekonto/A-10.010/A-10.012/
      section: "A-10-5.2"
      retrieved_on: 2026-10-01
      authority_type: tax_authority
    claim: "Account funds cannot be used to buy foreign currency; FX gains/losses on currency held in ASK are outside the ASK exemption and are realised on conversion to NOK, withdrawal, or use to buy securities."
