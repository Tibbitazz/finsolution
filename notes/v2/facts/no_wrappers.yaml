  - fact_id: no.wrapper.ask.accounts_and_transfers
    scope: {jurisdiction: NO, account_type: ASK}
    attribute: account_count_and_transfers
    value:
      max_accounts: unlimited
      ask_to_ask_transfer: tax_neutral
      transfer_in_from_ordinary_account: taxable_realisation_fifo
    unit: null
    basis: null
    period: null
    effective_from: null
    claim: "Any number of ASKs; ASK-to-ASK transfers tax-neutral; moving holdings in from an ordinary account is a taxable realisation (FIFO)."

