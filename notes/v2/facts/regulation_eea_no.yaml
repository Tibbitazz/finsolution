  - fact_id: reg.no.priips.no_kid_no_retail_sale
    scope: {jurisdiction: NO, client_category: retail, instrument_type: PRIIP}
    attribute: retail_sale_without_norwegian_kid
    value: not_permitted
    unit: null
    basis: null
    period: null
    legal_status: effective
    verification_status: verified
    verification_level: V-full
