  - fact_id: reg.eu.priips.scope_investment_funds
    scope: {jurisdiction: EEA, client_category: retail}
    attribute: priip_definition_covers_investment_funds
    value: {prip_definition: "amount repayable subject to fluctuations because of exposure to reference values or to the performance of assets not directly purchased by the retail investor (Art. 4(1))", recital_6_examples: [investment_funds, life_insurance_with_investment_element, structured_products, structured_deposits], recital_7_not_priips: [directly_held_shares, sovereign_bonds]}
    unit: null
    basis: null
    period: null
    legal_status: effective
    verification_status: verified
    verification_level: V-full
    effective_from: null      # EU application date not read in S3 (U7c); Norwegian application per EEA incorporation
    source:
      citation: "Regulation (EU) No 1286/2014 (PRIIPs), Art. 4(1), 4(3); recitals 6–7 (as adopted)"
      url: https://www.legislation.gov.uk/eur/2014/1286/contents/adopted
      section: "Art. 4(1), 4(3); recitals 6, 7"
      retrieved_on: 2026-10-01
      authority_type: eu_legislation
    claim: "Investment funds are PRIIPs; directly held shares are not."
    notes: "Applies by legal form, regardless of domicile; an ETF is an investment fund. Edge forms (ETNs, grantor trusts) also fall under Art. 4(1) by definition but their classification is an S6 instrument matter."

