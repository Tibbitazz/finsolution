      url: null
      retrieved_on: 2026-10-01
      authority_type: statute
    claim: "Conditional rule: a person selling a PRIIP to a Norwegian retail investor must provide a Norwegian KID before the investor is bound, also on the customer's own initiative; where none exists the obligation cannot be met and breach is sanctionable."
    provenance: "One-step application of mandatory provisions (Art. 13(1) + § 4 + Finanstilsynet scope statement). No source sentence states 'prohibited' in those words."

